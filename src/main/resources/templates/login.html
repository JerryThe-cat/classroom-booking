<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 校园教室预约系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <h1 class="auth-title">校园教室预约系统</h1>
        <p class="auth-sub">使用学号或工号登录</p>
        <div id="loginError" class="error-msg" style="display:none;"></div>
        <form id="loginForm">
            <div class="form-item">
                <label for="username">学号 / 工号</label>
                <input type="text" id="username" placeholder="请输入账号"
                       autocomplete="username" required>
            </div>
            <div class="form-item">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" id="loginBtn" class="btn btn-primary btn-block">登录</button>
        </form>
        <p class="auth-link">没有账号？<a th:href="@{/register}">去注册</a></p>
    </div>
</div>
<script th:src="@{/js/lib/axios.min.js}"></script>
<script th:src="@{/js/request.js}"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
