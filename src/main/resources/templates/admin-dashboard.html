<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>数据看板 - 校园教室预约系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="topbar">
    <span class="brand">校园教室预约系统</span>
    <span class="links">
        <a th:href="@{/admin/classrooms}">教室管理</a>
        <a th:href="@{/admin/pending}">待审批</a>
        <a th:href="@{/admin/bookings}">全部预约</a>
        <a th:href="@{/admin/dashboard}">数据看板</a>
        <a href="/login" id="logoutLink">退出</a>
        <span class="muted" id="userName">未登录</span>
    </span>
</div>
<div class="container">
    <div class="stat-grid" id="statGrid">
        <div class="card stat-card"><div class="stat-num">—</div><div class="stat-label">加载中</div></div>
    </div>
    <div class="card">
        <h2>预约次数前五教室</h2>
        <p class="hint">统计范围：最近30天，按预约次数排序。</p>
        <div class="table-scroll">
            <table class="table">
                <thead><tr><th>教室</th><th>预约次数</th></tr></thead>
                <tbody id="topTable"><tr><td colspan="2" class="hint">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
    <div class="card">
        <h2>人流量历史</h2>
        <div class="form-grid">
            <div class="form-item">
                <label for="classroomSelect">教室</label>
                <select id="classroomSelect"></select>
            </div>
            <div class="form-item">
                <label>&nbsp;</label>
                <button class="btn btn-primary" type="button" id="loadOccupancy">
                    加载最近30天数据
                </button>
            </div>
        </div>
        <div class="table-scroll">
            <table class="table">
                <thead>
                <tr><th>时间桶</th><th>平均人数</th><th>峰值人数</th><th>平均占用率</th></tr>
                </thead>
                <tbody id="occupancyTable">
                <tr><td colspan="4" class="hint">请选择教室后加载</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script th:src="@{/js/lib/axios.min.js}"></script>
<script th:src="@{/js/request.js}"></script>
<script th:src="@{/js/admin-dashboard.js}"></script>
</body>
</html>
